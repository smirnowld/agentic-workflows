name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make test
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          PUBLIC_TEXT_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PT_RANGE: ${{ github.event.pull_request && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  docs:
    name: Docs (docs-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Docs touched or a reason given
        if: github.event_name == 'pull_request'
        run: bin/docs-check touched --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Docs within budget
        run: bin/docs-check budget

  ci-ok:
    name: CI OK
    if: always()
    needs: [test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a job did not succeed: $r"; exit 1; }
          done
